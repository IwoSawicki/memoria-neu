server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Kompression für Text-Assets
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/xml
        font/woff2;

    # Astro nutzt Directory-URLs: /impressum -> /impressum/index.html
    location / {
        try_files $uri $uri/ =404;
    }

    # Eigene 404-Seite (von Astro generiert)
    error_page 404 /404.html;

    # Bilder / Fonts lange cachen (Dateinamen sind stabil bzw. gehasht)
    location /images/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Astro-Build-Assets (gehashte Dateinamen) unveränderlich cachen
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Favicon leise ausliefern
    location = /favicon.svg {
        access_log off;
        expires 7d;
    }
}
