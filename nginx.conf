server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sicherheits-Header
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Server-Version verbergen
    server_tokens off;

    # --- 301-Weiterleitungen alter URLs (SEO: Rankings erhalten, kein 404) ---
    # Inhalte liegen jetzt auf der One-Page-Startseite; Pferdekremierung u. a.
    # brauchen keine eigene Seite mehr. (Tierurnen bekommt später ggf. eine
    # eigene Unterseite – dann dieses Ziel anpassen.)
    location = /leistungen         { return 301 /; }
    location = /leistungen/        { return 301 /; }
    location = /preise             { return 301 /; }
    location = /preise/            { return 301 /; }
    # /tierurnen-andenken ist eine echte Unterseite (kein Redirect).
    location = /pferdekremierung   { return 301 /; }
    location = /pferdekremierung/  { return 301 /; }
    location = /kontakt            { return 301 /; }
    location = /kontakt/           { return 301 /; }
    # Alte Impressum/Datenschutz-URL der bisherigen Seite
    location = /anfahrt            { return 301 /impressum; }
    location = /anfahrt/           { return 301 /impressum; }

    # Kompression für Text-Assets
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/xml
        font/woff2;

    # Astro nutzt Directory-URLs: /impressum -> /impressum/index.html
    location / {
        try_files $uri $uri/ =404;
    }

    # Eigene 404-Seite (von Astro generiert)
    error_page 404 /404.html;

    # Bilder / Fonts lange cachen (Dateinamen sind stabil bzw. gehasht)
    location /images/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Astro-Build-Assets (gehashte Dateinamen) unveränderlich cachen
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Favicon leise ausliefern
    location = /favicon.svg {
        access_log off;
        expires 7d;
    }
}
